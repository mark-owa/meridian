server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache hashed assets; index.html itself is never cached so
    # deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any path that isn't a real file goes to index.html so
    # React Router can handle client-side routes like /leads on a hard reload.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
