x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the root .env file}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
  CHAT_MODEL: ${CHAT_MODEL:-gpt-5.6-terra}
  FAST_MODEL: ${FAST_MODEL:-gpt-5.6-luna}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  DATABASE_URL: postgresql://meridian:${POSTGRES_PASSWORD:-meridian_dev_password}@postgres:5432/meridian
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
  CHROMA_HOST: chroma
  CHROMA_PORT: 8000
  UPLOAD_DIR: /app/uploads

services:
  chroma:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meridian_dev_password}
      POSTGRES_DB: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      <<: *backend-env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
  chroma_data:
