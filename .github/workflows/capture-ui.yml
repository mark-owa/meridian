name: Capture portfolio UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-ui.yml'
      - 'tooling/capture/**'
      - 'frontend/**'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: meridian-capture
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: sk-portfolio-placeholder
      POSTGRES_PASSWORD: meridian_capture_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start disposable application
        run: |
          docker compose up -d --build postgres redis chroma api web
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:5173 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:5173 >/dev/null

      - name: Install capture tools
        working-directory: tooling/capture
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Capture real UI
        working-directory: tooling/capture
        run: node capture.mjs

      - name: Upload verified captures
        uses: actions/upload-artifact@v4
        with:
          name: meridian-ui-captures
          path: tooling/capture/output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish captures to repository
        run: |
          mkdir -p docs/assets/demo
          cp tooling/capture/output/dashboard.png docs/assets/demo/
          cp tooling/capture/output/leads.png docs/assets/demo/
          cp tooling/capture/output/knowledge-base.png docs/assets/demo/
          cp tooling/capture/output/document-intelligence.png docs/assets/demo/
          cp tooling/capture/output/capture-evidence.json docs/assets/demo/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo
          if git diff --cached --quiet; then
            echo "Captures unchanged"
          else
            git commit -m "Publish verified Meridian UI captures"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p capture-diagnostics
          docker compose ps > capture-diagnostics/services.txt
          docker compose logs --no-color > capture-diagnostics/compose.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-capture-diagnostics
          path: capture-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop disposable application
        if: always()
        run: docker compose down --volumes
