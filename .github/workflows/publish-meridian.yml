name: Publish Meridian source

on:
  push:
    paths:
      - ".github/workflows/publish-meridian.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/publish-meridian.yml /tmp/publish-meridian.yml
          cat .publish/x00 .publish/x01 .publish/x02 .publish/x03 .publish/x04 .publish/x05 .publish/x06 .publish/x07 > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo "2da5760ee6b1ae71ed185d19566b04166900bbfb1b7097cf03bd438a80c22e47  /tmp/source.tar.xz" | sha256sum -c -
          mkdir /tmp/meridian-source
          tar -xJf /tmp/source.tar.xz -C /tmp/meridian-source
          test -f /tmp/meridian-source/README.md
          test -f /tmp/meridian-source/backend/main.py
          test -f /tmp/meridian-source/frontend/package.json

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/meridian-source/. .
          mkdir -p .github/workflows
          cp /tmp/publish-meridian.yml .github/workflows/publish-meridian.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish Meridian portfolio source"
          git push origin HEAD:main
